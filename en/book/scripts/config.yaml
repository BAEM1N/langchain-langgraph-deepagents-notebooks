# English notebook-to-Typst regeneration config.
#
# The English handbook build (`python en/book/scripts/build.py`) compiles the
# curated Typst tree directly and does not consume this file automatically.
# Run this config manually only when refreshing the new notebook-derived English
# chapters listed here. It intentionally excludes older curated chapters so a
# batch conversion does not overwrite hand-polished Typst.
book:
  title: Agent Handbook with LangChain, LangGraph, DeepAgents
  language: en
skip_patterns:
- Observability setup
- '# Observability'
- langfuse_handler
- lf_config
- LANGSMITH_TRACING
output_truncate_lines: 30
parts:
- number: 2
  title: LangChain
  source_dir: 02_langchain
  chapters:
  - source: 14_semantic_search.ipynb
    output: ch14.typ
    title: Semantic Search
    diagrams: []
- number: 3
  title: LangGraph
  source_dir: 03_langgraph
