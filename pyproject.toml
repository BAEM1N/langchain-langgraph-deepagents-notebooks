    "langgraph>=1.2.5",
    "faiss-cpu>=1.13",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.22",
    "slack-sdk>=3.40.1",
    "assemblyai>=0.54.1",
    "cartesia>=3.0.2",
    "websockets>=14,<16",
    "agentevals>=0.0.9",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.1",
