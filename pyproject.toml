[project]
name = "langchain-langgraph-deepagents-notebooks"
version = "1.3.2"
description = "LangChain & LangGraph & DeepAgents 자료"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.23,<0.8.0",
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "langchain[mcp]>=1.4.4,<1.5.0",
    "langchain-core>=1.6.9,<2.0.0",
    "langchain-openai>=1.7.0,<2.0.0",
    "langchain-community>=0.4.2,<0.5.0",
    "mcp>=2.3.0,<3.0.0",
    "fastmcp>=4.1.0,<5.0.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14,<1.3.0",
    "faiss-cpu>=1.15.1",
    "python-dotenv>=1.2.4",
    "tavily-python>=0.8.5",
    "slack-sdk>=3.45.0",
    "assemblyai>=1.6.1,<2.0.0",
    "cartesia>=4.2.0,<5.0.0",
    "websockets>=15.0.1,<16",
    "agentevals>=0.0.9",
    "scikit-learn>=1.9.1",
    "pandas>=3.0.6",
    "langchain-tavily>=0.2.18",
    "pymupdf4llm>=1.28.2",
]

[project.optional-dependencies]
observability = [
    "langfuse>=4.17.0,<5.0.0",
    "langsmith>=0.14.7,<0.15.0",
]
interpreter = [
    "langchain-quickjs>=0.3.8,<0.4.0",
]
