[project]
name = "langchain-langgraph-deepagents-notebooks"
version = "1.3.1"
description = "LangChain & LangGraph & DeepAgents 자료"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.23,<0.8.0",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "langchain[mcp]>=1.4.4,<1.5.0",
    "langchain-core>=1.6.9,<2.0.0",
    "langchain-openai>=1.7.0,<2.0.0",
    "langchain-community>=0.4.2,<0.5.0",
    "mcp>=1.9.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.14,<1.3.0",
    "faiss-cpu>=1.13",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.22",
    "slack-sdk>=3.40.1",
    "assemblyai>=0.54.1",
    "cartesia>=3.0.2",
    "websockets>=14,<16",
    "agentevals>=0.0.9",
    "scikit-learn>=1.8.0",
    "pandas>=3.0.1",
    "langchain-tavily>=0.2.18",
    "pymupdf4llm>=1.27.2.3",
]

[project.optional-dependencies]
observability = [
    "langfuse>=2.0",
    "langsmith>=0.14.7,<0.15.0",
]
interpreter = [
    "langchain-quickjs>=0.3.8,<0.4.0",
]
