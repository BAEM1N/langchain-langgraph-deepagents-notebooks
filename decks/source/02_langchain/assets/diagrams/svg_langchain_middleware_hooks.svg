<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f7fbff"/><defs><style>.t{font-family:Arial, sans-serif;fill:#071521}.h{font-size:32px;font-weight:800}.m{font-size:22px;font-weight:700}.s{font-size:17px}.box{fill:#fff;stroke:#53b8ff;stroke-width:3;rx:18}.teal{fill:#e7f7f8;stroke:#83ced2;stroke-width:4;rx:18}.coral{fill:#fff3f1;stroke:#ed7969;stroke-width:4;rx:18}.gray{fill:#f4f6fb;stroke:#7c8aa5;stroke-width:3;rx:18}.arrow{stroke:#0b5f93;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#0b5f93"/></marker></defs><text x="54" y="70" class="t h">Middleware Hook Points</text>
