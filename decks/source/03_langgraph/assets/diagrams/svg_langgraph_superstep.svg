<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f7fbff"/><defs><style>.t{font-family:Arial, sans-serif;fill:#071521}.h{font-size:32px;font-weight:800}.m{font-size:22px;font-weight:700}.s{font-size:17px}.box{fill:#fff;stroke:#53b8ff;stroke-width:3;rx:18}.teal{fill:#e7f7f8;stroke:#83ced2;stroke-width:4;rx:18}.coral{fill:#fff3f1;stroke:#ed7969;stroke-width:4;rx:18}.gray{fill:#f4f6fb;stroke:#7c8aa5;stroke-width:3;rx:18}.arrow{stroke:#0b5f93;stroke-width:5;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#0b5f93"/></marker></defs><text x="54" y="70" class="t h">Pregel-style Supersteps</text><rect x="90" y="140" width="250" height="120" class="teal"/><text x="130" y="195" class="t m">Superstep N</text><text x="125" y="228" class="t s">active nodes execute</text><rect x="475" y="140" width="250" height="120" class="coral"/><text x="535" y="195" class="t m">Channels</text><text x="520" y="228" class="t s">writes become next inputs</text><rect x="860" y="140" width="250" height="120" class="gray"/><text x="900" y="195" class="t m">Superstep N+1</text><text x="905" y="228" class="t s">next active nodes run</text><path d="M340 200 H475" class="arrow"/><path d="M725 200 H860" class="arrow"/><rect x="260" y="390" width="260" height="105" class="box"/><text x="300" y="448" class="t m">vote to halt</text><rect x="680" y="390" width="260" height="105" class="box"/><text x="705" y="448" class="t m">no active nodes → END</text><path d="M520 443 H680" class="arrow"/></svg>